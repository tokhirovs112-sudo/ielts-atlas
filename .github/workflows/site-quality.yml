name: Site quality checks

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"   # Mondays: also check outside links (YouTube etc.)

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check JavaScript syntax
        run: |
          for file in js/*.js; do
            node --check "$file"
          done
          node --check sw.js
      - name: Test daily streak behaviour
        run: node scripts/test-streak.js
        env:
          TZ: Asia/Tashkent
      - name: Check local HTML references
        run: python scripts/check-site.py
      - name: Test the form and audio Worker
        run: node tests/test-worker.mjs

  browser-tests:
    # Opens every page in a real browser (laptop, iPhone and Android sizes)
    # and uses each feature like a student: tests, quizzes, timers, saving, forms, offline.
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser
        run: |
          pip install playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Run site tests
        env:
          TZ: Asia/Tashkent
        run: python tests/test-site.py

  outside-links:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check YouTube and other outside links
        run: python tests/check-external-links.py
