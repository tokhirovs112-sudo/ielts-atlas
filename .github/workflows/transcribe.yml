name: Temporary transcription (Mock 04)
on:
  push:
    branches: [tmp-transcribe-mock04]
jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install faster-whisper==1.1.1 requests "av==13.1.0"
      - name: Transcribe unclear parts with the large model
        run: |
          sudo apt-get install -y -qq ffmpeg >/dev/null
          for r in "380 30 q9" "340 25 q7" "175 40 q1to3"; do set -- $r; ffmpeg -v error -y -ss $1 -t $2 -i tmp/audio.mp3 -ar 16000 -ac 1 /tmp/$3.wav; done
          python - <<'PY'
          from faster_whisper import WhisperModel
          m = WhisperModel("large-v3", device="cpu", compute_type="int8")
          out = open("transcript.txt", "w")
          for name in ["q9", "q7", "q1to3"]:
              segs, _ = m.transcribe(f"/tmp/{name}.wav", beam_size=5, language="en", word_timestamps=True)
              out.write(f"== {name}\n")
              for s in segs:
                  out.write(f"[{s.start:06.2f}] {s.text.strip()}\n")
                  out.write("    words: " + " | ".join(w.word.strip() for w in s.words) + "\n")
          PY
      - name: Show transcript
        run: cat transcript.txt
