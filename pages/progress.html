  <style>
    .pg-wrap{max-width:980px;margin:0 auto;padding:26px 0 44px}
    .pg-hero{margin-bottom:20px}.pg-hero h1{margin:4px 0 6px}.pg-hero p{margin:0;color:var(--ink-5d7166,#62756b)}
    .pg-eyebrow{font-size:.78rem;letter-spacing:.14em;font-weight:800;color:#2f7a60}
    .pg-skills{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:22px 0}
    .pg-skill{display:block;padding:18px;border:1px solid #dfe8e1;border-radius:18px;background:#fff;color:inherit;text-decoration:none}
    .pg-skill small{display:block;font-size:.78rem;font-weight:800;letter-spacing:.08em;color:#4d6358;text-transform:uppercase}
    .pg-skill b{display:block;font-size:2rem;line-height:1.15;margin:8px 0 2px;color:#17352a}
    .pg-skill b.none{font-size:1.05rem;color:#2f6f58;margin:14px 0 6px}
    .pg-skill span{font-size:.86rem;color:#4d6358}
    .pg-trend{font-weight:800}.pg-trend.up{color:#187344}.pg-trend.down{color:#a1401f}
    .pg-overall{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:18px 22px;border-radius:18px;background:#1f6b55;color:#fff;margin:0 0 22px}
    .pg-overall b{font-size:2.2rem}.pg-overall p{margin:0;max-width:560px;color:#e6f4ec}
    .pg-card{padding:20px 22px;border:1px solid #dfe8e1;border-radius:18px;background:#fff;margin:0 0 18px}
    .pg-card h2{margin:0 0 12px;font-size:1.15rem;color:#1f3d31}
    .pg-list{list-style:none;margin:0;padding:0}
    .pg-list li{display:grid;grid-template-columns:92px 1fr auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid #edf2ee}
    .pg-list li:first-child{border-top:0}
    .pg-list time{font-size:.84rem;color:#4d6358}.pg-list a,.pg-list .nm{color:#1f3d31;font-weight:700;text-decoration:none}
    .pg-list .tag{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:99px;background:#eef4f0;color:#3b5a4c;font-size:.72rem;font-weight:700}
    .pg-sc{text-align:right;font-weight:800;color:#17352a;white-space:nowrap}.pg-sc small{display:block;font-weight:600;color:#4d6358;font-size:.78rem}
    .pg-mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
    .pg-mini div{padding:14px;border-radius:14px;background:#f4f8f5}.pg-mini b{display:block;font-size:1.4rem;color:#17352a}.pg-mini span{font-size:.85rem;color:#4d6358}
    .pg-empty{text-align:center;padding:34px 22px}.pg-empty p{color:#4d6358;max-width:520px;margin:8px auto 18px}
    .pg-btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
    .pg-btn{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid #cfe0d4;background:#f5faf6;color:#1f5a46;font-weight:700;text-decoration:none}
    .pg-btn.pri{background:#1f6b55;border-color:#1f6b55;color:#fff}
    .pg-note{font-size:.86rem;color:#4d6358}.pg-clear{background:none;border:0;color:#8a3b1f;font:inherit;font-size:.86rem;text-decoration:underline;cursor:pointer;padding:8px 0}
    .pg-saved{display:flex;flex-wrap:wrap;gap:8px}.pg-saved a{padding:8px 11px;border-radius:9px;background:#edf5f0;color:#22634c;font-size:.88rem;font-weight:700;text-decoration:none}
    @media(max-width:820px){.pg-skills{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:560px){.pg-wrap{padding:18px 0 34px}.pg-list li{grid-template-columns:1fr auto}.pg-list time{grid-column:1/-1;margin-bottom:-6px}.pg-mini{grid-template-columns:1fr}}
    html[data-theme="dark"] .pg-skill,html[data-theme="dark"] .pg-card{background:#16271f;border-color:#3a5348}
    html[data-theme="dark"] .pg-skill b,html[data-theme="dark"] .pg-card h2,html[data-theme="dark"] .pg-list a,html[data-theme="dark"] .pg-list .nm,html[data-theme="dark"] .pg-sc,html[data-theme="dark"] .pg-mini b{color:#e6f2ea}
    html[data-theme="dark"] .pg-skill small,html[data-theme="dark"] .pg-skill span,html[data-theme="dark"] .pg-list time,html[data-theme="dark"] .pg-sc small,html[data-theme="dark"] .pg-mini span,html[data-theme="dark"] .pg-note,html[data-theme="dark"] .pg-empty p,html[data-theme="dark"] .pg-hero p{color:#c3d6ca}
    html[data-theme="dark"] .pg-skill b.none{color:#a7d9b7}
    html[data-theme="dark"] .pg-eyebrow{color:#a7d9b7}
    html[data-theme="dark"] .pg-list li{border-color:#2c4338}
    html[data-theme="dark"] .pg-list .tag,html[data-theme="dark"] .pg-mini div,html[data-theme="dark"] .pg-saved a{background:#203a32;color:#dcebe2}
    html[data-theme="dark"] .pg-btn{background:#203a32;border-color:#456052;color:#e6f2ea}
    html[data-theme="dark"] body .pg-btn.pri,html[data-theme="dark"] .pg-overall{background:#1f5c43!important;border-color:#1f5c43!important;color:#fff!important}
    html[data-theme="dark"] .pg-trend.up{color:#8fe0ad}html[data-theme="dark"] .pg-trend.down{color:#ffb39a}
    html[data-theme="dark"] .pg-clear{color:#ffb39a}

    <main class="container pg-wrap" id="progressPage">
    <section class="pg-hero"><div class="pg-eyebrow">MY PROGRESS</div><h1>Your IELTS progress</h1><p>Your test scores and estimated bands, saved on this device.</p></section>
    <div id="pgOut"></div>
  </main>
<script src="../js/mock-results.js?v=20261127-flow2"></script>
<script>
document.addEventListener("DOMContentLoaded",function(){
  const $=id=>document.getElementById(id);
  const read=(k,f)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?f:v}catch(e){return f}};
  const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  const M=window.EnglisityMock;
  const SK={listening:{name:"Listening",href:"listening.html",go:"Take a Listening test"},reading:{name:"Reading",href:"reading.html",go:"Take a Reading test"},writing:{name:"Writing",href:"writing.html",go:"Get a Writing task marked"},speaking:{name:"Speaking",href:"speaking.html",go:"Get a Speaking answer marked"}};
  // Every finished test, quiz and AI check is kept in englisity-history-v1 (see js/features.js).
  let hist=read("englisity-history-v1",[]);if(!Array.isArray(hist))hist=[];
  function skillOf(h){
    const n=String(h.item||""),p=String(h.path||"");
    if(/^AI writing/i.test(n))return "writing";
    if(/^AI speaking/i.test(n))return "speaking";
    if(/^Vocabulary/i.test(n))return "vocabulary";
    if(/listening/i.test(p)||/^Listening/i.test(n))return "listening";
    if(/^Article quiz/i.test(n))return "articles";
    return "reading";
  }
  function bandOf(h,skill){
    if(skill==="writing"||skill==="speaking")return h.total===18?h.score/2:null;
    if(h.total===40&&(skill==="listening"||skill==="reading"))return skill==="listening"?M.listeningBand(h.score):M.readingBand(h.score);
    return null;
  }
  const rows=hist.filter(h=>h&&h.at&&!/^Full mock/i.test(h.item||"")).map(h=>{const s=skillOf(h);return Object.assign({},h,{skill:s,band:bandOf(h,s)})});
  // Full mock test sections count too.
  const mocks=M.all?M.all():{};
  Object.keys(mocks).forEach(t=>Object.keys(mocks[t]||{}).forEach(s=>{const r=mocks[t][s];if(!r||!r.at)return;
    if(typeof r.band!=="number")return;
    if(rows.some(x=>x.skill===s&&Math.abs(x.at-r.at)<120000))return;
    rows.push({at:r.at,item:"Full "+t.replace("mock-","Mock Test ").replace(/ 0(\d)/," $1")+" · "+SK[s].name,path:"/pages/"+t+"-"+s+".html",score:r.score,total:r.total,skill:s,band:r.band,exam:true});
  }));
  rows.sort((a,b)=>b.at-a.at);
  const streak=(window.EnglisityProgress&&window.EnglisityProgress.getStreak)?window.EnglisityProgress.getStreak():read("englisity-quiz-streak-v1",{current:0,longest:0});
  const words=read("englisity-vocab-learning-v2",{}),vstats=read("englisity-vocab-stats-v1",{});
  const saved=read("englisity-bookmarks-v1",[]);
  const date=t=>new Date(t).toLocaleDateString(undefined,{day:"numeric",month:"short"});
  let html="";
  const scored=rows.filter(r=>["listening","reading","writing","speaking"].includes(r.skill));
  if(!scored.length){
    html+='<section class="pg-card pg-empty" id="pgEmpty"><h2>No results yet</h2><p>Finish a test or get an answer marked by AI, and your scores and estimated bands will show here, so you can see how you improve.</p><div class="pg-btns"><a class="pg-btn pri" href="mock-tests.html">Take a full mock test</a><a class="pg-btn" href="listening.html">Listening test</a><a class="pg-btn" href="reading.html">Reading test</a></div></section>';
  }else{
    const est={};
    html+='<div class="pg-skills" id="pgSkills">'+Object.keys(SK).map(s=>{
      const b=rows.filter(r=>r.skill===s&&typeof r.band==="number");
      const n=rows.filter(r=>r.skill===s).length;
      if(!b.length)return '<a class="pg-skill" href="'+SK[s].href+'"><small>'+SK[s].name+'</small><b class="none">'+SK[s].go+' →</b><span>'+(n?n+" practised, no band yet (full tests give a band)":"No band yet")+'</span></a>';
      const last3=b.slice(0,3),avg=M.roundBand(last3.reduce((a,r)=>a+r.band,0)/last3.length);est[s]=avg;
      let trend="";if(b.length>=2){const d=b[0].band-b[1].band;trend=d>0?'<span class="pg-trend up">▲ +'+d.toFixed(1)+'</span> since last':d<0?'<span class="pg-trend down">▼ '+d.toFixed(1)+'</span> since last':"Same as last time";}
      return '<a class="pg-skill" href="'+SK[s].href+'" data-skill="'+s+'"><small>'+SK[s].name+'</small><b>'+avg.toFixed(1)+'</b><span>'+(last3.length>1?"Average of your last "+last3.length:"From 1 result")+(trend?" · "+trend:"")+'</span></a>';
    }).join("")+'</div>';
    const ks=Object.keys(est);
    if(ks.length===4){const o=M.roundBand(ks.reduce((a,k)=>a+est[k],0)/4);html+='<section class="pg-overall" id="pgOverall"><b>'+o.toFixed(1)+'</b><p>Estimated overall band from your recent results in all four skills. Writing and Speaking come from AI marking, so treat this as a guide, not an official score.</p></section>';}
    else{const miss=Object.keys(SK).filter(k=>!(k in est)).map(k=>SK[k].name);html+='<p class="pg-note" id="pgMissing">For an estimated overall band, you still need a band in: '+miss.join(", ")+'. A <a href="mock-tests.html">full mock test</a> gives all four.</p>';}
  }
  if(rows.length){
    html+='<section class="pg-card"><h2>Recent results</h2><ul class="pg-list" id="pgRecent">'+rows.slice(0,15).map(r=>{
      const name=esc(String(r.item||"Test").replace(/^AI (writing|speaking) check: /i,"AI-marked $1: "));
      const link=r.path&&/^\/[\w\/.-]+$/.test(r.path)?'<a href="'+esc(r.path)+'">'+name+'</a>':'<span class="nm">'+name+'</span>';
      const sc=(r.skill==="writing"||r.skill==="speaking")?(typeof r.band==="number"?"Band "+r.band.toFixed(1):""):(r.total?r.score+" / "+r.total:"")+(typeof r.band==="number"&&r.skill!=="writing"&&r.skill!=="speaking"?"<small>Band "+r.band.toFixed(1)+"</small>":"");
      return '<li><time>'+date(r.at)+'</time><div>'+link+(r.exam?'<span class="tag">Exam mode</span>':'')+'</div><div class="pg-sc">'+sc+'</div></li>';
    }).join("")+'</ul></section>';
  }
  const known=(words.known||[]).length,learning=(words.saved||[]).length;
  html+='<section class="pg-card"><h2>Habits</h2><div class="pg-mini"><div><b>🔥 '+(streak.current||0)+'</b><span>day streak (longest '+(streak.longest||0)+')</span></div><div><b>'+known+'</b><span>words you know · '+learning+' learning</span></div><div><b>'+(vstats.passed||0)+'</b><span>vocabulary quizzes passed</span></div></div></section>';
  if(saved.length)html+='<section class="pg-card"><h2>Saved resources</h2><div class="pg-saved">'+saved.map(x=>'<a href="'+esc(x.url)+'">'+esc(x.title)+'</a>').join("")+'</div></section>';
  html+='<p class="pg-note">Your progress is kept only in this browser. Clearing browser data, or using another phone or computer, starts it fresh. '+(rows.length?'<button class="pg-clear" type="button" id="pgClear">Clear my results</button>':'')+'</p>';
  $("pgOut").innerHTML=html;
  const c=$("pgClear");if(c)c.onclick=()=>{if(confirm("Delete all your saved results on this device?")){try{localStorage.removeItem("englisity-history-v1");localStorage.removeItem("englisity-mock-results-v1")}catch(e){}location.reload()}};
});
</script>
